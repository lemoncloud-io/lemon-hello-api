#-----------------------------------
# Dummmy Environment Variables.
#-----------------------------------
# default
default_env: &default_env
  LS: 0                   # log silence.
  LC: 1                   # line-coloring
  TS: 1                   # time-stamp in line
  NAME: 'none'            # profile name.

#-----------------------------------
# local development configuration.
local:
  <<: *default_env
  STAGE: 'local'
  MY_DYNAMO_TABLE: eureka-hello-table-dev
  SQS_ENDPOINT: 'https://sqs.ap-northeast-2.amazonaws.com/085403634746/eureka-hello-sqs-dev'

#-----------------------------------
# development server
dev:
  <<: *default_env
  STAGE: 'develop'

#-----------------------------------
# production with AWS deploy
prod:
  <<: *default_env
  STAGE: 'production'
  NS: SS
  TS: 0

